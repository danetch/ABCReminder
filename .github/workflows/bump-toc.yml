name: Bump TOC interface version

on:
  schedule:
    - cron: "37 5 * * *"   # daily, 05:37 UTC
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check live game version
        id: bump
        run: echo "interface=$(python3 .github/scripts/bump_toc.py)" >> "$GITHUB_OUTPUT"

      - name: Commit to main
        if: steps.bump.outputs.interface != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ABCReminder.toc
          git commit -m "chore: bump TOC interface to ${{ steps.bump.outputs.interface }}"
          git push
